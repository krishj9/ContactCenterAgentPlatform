[project]
name = "contact-center-agent-platform"
version = "0.1.0"
description = "Contact Center Agent Helper Platform"
readme = "README.md"
requires-python = "==3.14.8"
dependencies = [
    "cc-agent-platform-backend",
]

[dependency-groups]
dev = [
    "cc-agent-platform-backend[dev]",
]

[tool.uv]
managed = true
package = false

[tool.uv.sources]
cc-agent-platform-backend = { workspace = true }

[tool.uv.workspace]
members = ["backend"]

[tool.ruff]
target-version = "py313"
line-length = 100

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
]
ignore = [
    "E501", # line length handled by formatter
    "E402", # module level import not at top of file for standalone scripts
]

[tool.ruff.lint.isort]
known-first-party = ["app", "eval", "pipeline"]

[tool.pytest.ini_options]
testpaths = ["backend/tests", "eval"]
pythonpath = ["backend", "."]
asyncio_mode = "auto"
markers = [
    "integration: marks tests as integration tests that require network or external services",
]
addopts = "--disable-socket --allow-unix-socket -m 'not integration'"

[tool.mypy]
python_version = "3.14"
strict = true
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
disallow_untyped_decorators = false
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
mypy_path = "backend"

[[tool.mypy.overrides]]
module = ["fastapi.*", "pgvector.*", "redis.*", "yaml.*", "sentence_transformers.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["tests.*"]
disallow_untyped_defs = false

[tool.pyrefly]
search-path = [
    ".",
    "backend",
]
site-package-path = [
    ".venv/lib/python3.14/site-packages",
]



