[project]
name = "contact-center-agent-platform"
version = "0.1.0"
description = "Contact Center Agent Helper Platform"
readme = "README.md"
requires-python = "==3.14.8"
dependencies = []

[tool.uv]
managed = true

[tool.ruff]
target-version = "py313"
line-length = 100

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
]
ignore = [
    "E501", # line length handled by formatter
]

[tool.ruff.lint.isort]
known-first-party = ["app", "eval"]

[tool.pytest.ini_options]
testpaths = ["backend/tests", "eval"]
pythonpath = ["backend", "."]
asyncio_mode = "auto"
markers = [
    "integration: marks tests as integration tests that require network or external services",
]
addopts = "--disable-socket --allow-unix-socket -m 'not integration'"
