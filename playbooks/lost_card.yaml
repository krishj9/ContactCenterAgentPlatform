intent_label: "lost_card"
title: "Lost or Stolen Card Lock and Replacement Workflow"
action_type: "escalate"
default_citations:
  - "pol_card_security_01_s4_c1"
  - "pol_card_security_01_s2_c1"
steps:
  - "Immediately apply temporary security lock on lost card credential in Card Security Console."
