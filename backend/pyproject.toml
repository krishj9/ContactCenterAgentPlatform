[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "cc-agent-platform-backend"
version = "0.1.0"
description = "FastAPI Backend for Contact Center Agent Helper Platform"
requires-python = "==3.14.8"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic>=2.10.0",
    "pydantic-settings>=2.6.0",
    "pyyaml>=6.0.2",
    "python-dotenv>=1.0.1",
    "sqlalchemy>=2.0.36",
    "asyncpg>=0.30.0",
    "pgvector>=0.3.6",
    "alembic>=1.14.0",
    "redis>=5.2.0",
    "greenlet>=3.1.0",
    "google-genai>=2.33.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "pytest-socket>=0.7.0",
    "mypy>=1.10.0",
    "ruff>=0.9.0",
    "types-pyyaml>=6.0.12",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
target-version = "py313"
line-length = 100

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "C4", "UP"]
ignore = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["app", "eval", "pipeline"]

[tool.mypy]
python_version = "3.14"
strict = true
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
disallow_untyped_decorators = false
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true

[[tool.mypy.overrides]]
module = ["fastapi.*", "uvicorn.*", "asyncpg.*", "pgvector.*", "alembic.*", "redis.*", "yaml.*", "sentence_transformers.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["tests.*"]
disallow_untyped_defs = false



[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", ".."]
asyncio_mode = "auto"
markers = [
    "integration: marks tests as integration tests that require network or external services",
]
addopts = "--disable-socket --allow-unix-socket -m 'not integration'"

[tool.pyright]
pythonVersion = "3.14"
pythonPlatform = "Darwin"
extraPaths = [
    ".",
    "..",
]
venvPath = ".."
venv = ".venv"
typeCheckingMode = "standard"

[tool.pyrefly]
search-path = [
    ".",
    "..",
]
site-package-path = [
    "../.venv/lib/python3.14/site-packages",
    ".venv/lib/python3.14/site-packages",
]



