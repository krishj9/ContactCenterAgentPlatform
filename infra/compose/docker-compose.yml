services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: cc_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: cc_platform
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d cc_platform"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 5s

  redis:
    image: redis:7-alpine
    container_name: cc_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  fake-gcs-server:
    image: fsouza/fake-gcs-server:latest
    container_name: cc_fake_gcs
    restart: unless-stopped
    ports:
      - "4443:4443"
    command: -scheme http
    volumes:
      - gcs_data:/data

  api:
    build:
      context: ../..
      dockerfile: apps/api/Dockerfile
    container_name: cc_api
    restart: unless-stopped
    environment:
      APP_PROFILE: local
      CC_APP_PROFILE: local
      CC_POSTGRES_URL: postgresql+asyncpg://postgres:postgres@postgres:5432/cc_platform
      CC_REDIS_URL: redis://redis:6379/0
      CC_DEBUG: "true"
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8000/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  web:
    build:
      context: ../../apps/web
      dockerfile: Dockerfile
    container_name: cc_web
    restart: unless-stopped
    ports:
      - "3000:80"
    depends_on:
      - api

volumes:
  postgres_data:
  redis_data:
  gcs_data:
