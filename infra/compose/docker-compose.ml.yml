# Compose profile for local ML models: Cross-Encoder Reranker and Ollama Generator
services:
  reranker:
    image: ghcr.io/huggingface/text-embeddings-inference:cpu-1.5
    container_name: cc_reranker
    restart: unless-stopped
    environment:
      MODEL_ID: BAAI/bge-reranker-v2-m3
      PORT: 8002
    ports:
      - "8002:8002"
    command: --model-id BAAI/bge-reranker-v2-m3 --port 8002
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8002/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  ollama:
    image: ollama/ollama:latest
    container_name: cc_ollama
    restart: unless-stopped
    ports:
      - "11434:11434"
    volumes:
      - ollama_models:/root/.ollama
    environment:
      - OLLAMA_KEEP_ALIVE=24h
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

volumes:
  ollama_models:
