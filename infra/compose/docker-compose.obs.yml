# Observability Stack Docker Compose Profile (Phase P9.2)
# Provisions OTel Collector, Jaeger (Traces), Prometheus (Metrics), Grafana (Dashboards), and Loki (Logs).

services:
  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.96.0
    container_name: cc_otel_collector
    restart: unless-stopped
    command: ["--config=/etc/otelcol-contrib/config.yaml"]
    volumes:
      - ./otel-collector-config.yml:/etc/otelcol-contrib/config.yaml
    ports:
      - "4317:4317" # OTLP gRPC receiver
      - "4318:4318" # OTLP HTTP receiver
      - "8889:8889" # Prometheus metrics exporter

  jaeger:
    image: jaegertracing/all-in-one:1.55
    container_name: cc_jaeger
    restart: unless-stopped
    environment:
      - COLLECTOR_OTLP_ENABLED=true
    ports:
      - "16686:16686" # Jaeger Web UI
      - "14268:14268"

  prometheus:
    image: prom/prometheus:v2.51.0
    container_name: cc_prometheus
    restart: unless-stopped
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
    ports:
      - "9090:9090" # Prometheus Web UI

  grafana:
    image: grafana/grafana:10.4.0
    container_name: cc_grafana
    restart: unless-stopped
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning
      - ./grafana/dashboards:/etc/grafana/dashboards
    ports:
      - "3001:3000" # Grafana Web UI
    depends_on:
      - prometheus
      - jaeger

  loki:
    image: grafana/loki:2.9.4
    container_name: cc_loki
    restart: unless-stopped
    ports:
      - "3100:3100"
